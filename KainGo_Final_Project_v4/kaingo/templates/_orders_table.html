{% if orders %}
<div class="table-responsive"><table class="table table-hover align-middle">
  <thead><tr><th>#</th><th>Date</th><th>Type</th><th>Total</th><th>Status</th><th></th></tr></thead>
  <tbody>{% for o in orders %}
    <tr><td>{{ o.id }}</td><td>{{ o.created_at }}</td><td>{{ o.order_type }} ({{ o.payment_method }})</td><td>₱{{ '%.2f'|format(o.total|float) }}</td>
      <td><span class="badge status-{{ o.status|replace(' ', '') }}">{{ o.label() }}</span></td>
      <td><a class="btn btn-sm btn-outline-dark" href="{{ url_for('order_detail', order_id=o.id) }}">Track</a></td></tr>
  {% endfor %}</tbody></table></div>
{% else %}<p class="text-muted">No orders yet. <a href="{{ url_for('order_now') }}">Make your first order!</a></p>{% endif %}
