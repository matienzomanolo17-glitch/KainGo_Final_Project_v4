{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>My Profile</h2>
<div class="row g-4">
  <div class="col-lg-7"><div class="card p-4">
    <h5>Account details</h5>
    <form method="post" enctype="multipart/form-data" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="details">
      <div class="text-center mb-3">{% if user.photo %}<img src="{{ url_for('static', filename='uploads/' ~ user.photo) }}" class="profile-photo" alt="Profile photo">{% else %}<div class="profile-photo placeholder">{{ user.firstname[0] }}</div>{% endif %}</div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">First Name</label><input class="form-control" name="firstname" data-rule="name" value="{{ user.firstname }}" required></div>
        <div class="col-md-6"><label class="form-label">Last Name</label><input class="form-control" name="lastname" data-rule="lastname" value="{{ user.lastname }}" required></div>
        <div class="col-12"><label class="form-label">Email Address</label><input type="email" class="form-control" name="email" data-rule="email" value="{{ user.email }}" required></div>
        <div class="col-md-6"><label class="form-label">Contact Number</label><input class="form-control" name="contact" id="contact" data-rule="contact" value="{{ user.contact }}" maxlength="11" inputmode="numeric" required></div>
        <div class="col-12"><label class="form-label">Profile Photo (PNG/JPG, max 2 MB)</label><input type="file" class="form-control" name="photo" accept=".png,.jpg,.jpeg"></div>
        <div class="col-12"><label class="form-label">Delivery Address</label><textarea class="form-control" name="address" rows="2" placeholder="House no., street, barangay, town">{{ user.address }}</textarea></div>
      </div>
      <button class="btn btn-kg mt-3">Save Changes</button>
    </form>
  </div></div>
  <div class="col-lg-5"><div class="card p-4">
    <h5>Change password</h5>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password">
      <label class="form-label">Current password</label><input type="password" class="form-control mb-2" name="old" required>
      <label class="form-label">New password</label><input type="password" class="form-control mb-2" name="new" id="password" data-rule="password" required>
      <label class="form-label">Confirm new password</label><input type="password" class="form-control mb-3" name="confirm" id="confirm" data-rule="confirm" required>
      <button class="btn btn-dark">Update Password</button>
    </form>
  </div></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/validate.js') }}"></script>{% endblock %}
