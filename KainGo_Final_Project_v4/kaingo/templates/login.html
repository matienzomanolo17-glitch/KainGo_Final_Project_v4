{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card p-4 shadow-sm">
  <div class="text-center mb-2"><img src="{{ url_for('static', filename='logo.svg') }}" width="64" alt="{{ BRAND }} logo"></div>
  <h2 class="text-center">Welcome back</h2>
  <p class="text-muted">Log in to order.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control mb-3" name="email" value="{{ email }}" placeholder="example@gmail.com" required>
    <label class="form-label">Password</label>
    <input type="password" class="form-control" name="password" id="loginPassword" placeholder="Password" required>
    <div class="form-check my-3"><input class="form-check-input" type="checkbox" id="showPw" onclick="loginPassword.type = this.checked ? 'text' : 'password'"><label class="form-check-label" for="showPw">Show password</label></div>
    <button class="btn btn-kg w-100">Login</button>
  </form>
  <p class="mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</div></div></div>
{% endblock %}
